short_bio: >-
  <p>
    I am a third-year Ph.D. student in Computer Science at Northeastern University (China), working in the <a href="https://idc-neu.github.io" target="_blank">iDC-NEU Group</a> under the supervision of <a href="https://neuzhangyf.github.io" target="_blank">Prof. Yanfeng Zhang</a>. Prior to that, I received my M.S. in Computer Science from Northeastern University (China) and my B.S. from Henan University.
  </p>
  <p>
    My research interests broadly lie in building efficient systems to support the training of graph neural networks (GNNs), with a current focus on system-level optimizations for AI workloads.
  </p>




